{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Nueva Transacción</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('contabilidad.add_transaction') }}">
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de Transacción</label>
            <select class="form-select" id="tipo" name="tipo" required>
                <option value="">Selecciona el tipo</option>
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" step="0.01" class="form-control" id="cantidad" name="cantidad" min="0.01" required>
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" name="fecha" value="{{ today_date }}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="categoria_id" class="form-label">Categoría</label>
            <select class="form-select" id="categoria_id" name="categoria_id" required>
                <option value="">Selecciona una Categoría</option>
                {% for categoria in categorias %}
                <option value="{{ categoria.id }}">{{ categoria.nombre }} ({{ categoria.tipo }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Transacción</button>
        <a href="{{ url_for('contabilidad.list_transactions') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
